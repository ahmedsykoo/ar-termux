name: Release

# Push a tag like v0.1.0 (or run this workflow manually with a tag name) to build the APKs and publish them
# with SHA-256 sums as a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0-beta.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: scripts/test.sh
      - name: Fetch Termux at the pinned commit
        run: |
          git clone https://github.com/termux/termux-app termux-app
          git -C termux-app checkout "$(cat BASE_COMMIT)"
      - name: Apply patches
        run: for p in patches/*.patch; do git -C termux-app apply --verbose "$GITHUB_WORKSPACE/$p"; done
      - name: Build
        working-directory: termux-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename and checksum
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir dist
          for f in termux-app/app/build/outputs/apk/debug/*.apk; do
            abi="${f##*debug_}"; abi="${abi%.apk}"
            cp "$f" "dist/ar-termux_${TAG}_${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
