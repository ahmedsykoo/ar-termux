name: Release

# Push a tag like v0.1.0 to build the APKs and publish them (with SHA-256 sums) as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: scripts/test.sh
      - name: Fetch Termux at the pinned commit
        run: |
          git clone https://github.com/termux/termux-app termux-app
          git -C termux-app checkout "$(cat BASE_COMMIT)"
      - name: Apply patches
        run: for p in patches/*.patch; do git -C termux-app apply --verbose "$GITHUB_WORKSPACE/$p"; done
      - name: Build
        working-directory: termux-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename and checksum
        run: |
          mkdir dist
          for f in termux-app/app/build/outputs/apk/debug/*.apk; do
            abi="${f##*_}"; abi="${abi%.apk}"
            cp "$f" "dist/ar-termux_${GITHUB_REF_NAME}_${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
