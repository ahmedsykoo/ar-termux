name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: scripts/test.sh

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Fetch Termux at the pinned commit
        run: |
          git clone https://github.com/termux/termux-app termux-app
          git -C termux-app checkout "$(cat BASE_COMMIT)"
      - name: Apply patches
        run: for p in patches/*.patch; do git -C termux-app apply --verbose "$GITHUB_WORKSPACE/$p"; done
      - name: Build debug APKs
        working-directory: termux-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ar-termux-apk
          path: termux-app/app/build/outputs/apk/debug/*.apk
