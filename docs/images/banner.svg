<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- left: title -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="64" y="150" font-size="64" font-weight="800" fill="#f0f6fc">AR Termux</text>
    <rect x="64" y="172" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="64" y="224" font-size="24" fill="#9fb0c3">Termux with proper Arabic —</text>
    <text x="64" y="256" font-size="24" fill="#9fb0c3">connected letters, right-to-left, no reversed text.</text>
    <text x="64" y="330" font-size="20" fill="#6e7f94" font-family="'DejaVu Sans Mono',Consolas,monospace">Android · Hebrew · Persian · Urdu · GPL-3.0</text>
  </g>

  <!-- right: terminal window -->
  <g transform="translate(700,60)">
    <rect width="520" height="280" rx="14" fill="#0b0f19" stroke="#2a3350" stroke-width="2"/>
    <path d="M0 14a14 14 0 0 1 14-14h492a14 14 0 0 1 14 14v26H0z" fill="#1a2140"/>
    <circle cx="28" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="20" r="6" fill="#27c93f"/>
    <g font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="20">
      <text x="24" y="82" fill="#3ddc97">$</text>
      <text x="48" y="82" fill="#e6edf3">echo "مرحبا بالعالم"</text>
      <text x="496" y="128" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif" font-size="30" fill="#4cc9f0">مرحبا بالعالم</text>
      <text x="24" y="182" fill="#3ddc97">$</text>
      <text x="48" y="182" fill="#e6edf3">claude</text>
      <text x="496" y="228" text-anchor="end" font-family="'Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif" font-size="28" fill="#e6edf3">اشرحلي ملف <tspan font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="22" fill="#3ddc97">package.json</tspan></text>
      <rect x="24" y="244" width="12" height="22" fill="#3ddc97" opacity="0.8"/>
    </g>
  </g>
</svg>
